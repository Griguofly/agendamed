{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<h1>Ingresar</h1>
<form method="post" class="tarjeta formulario">
  {{ csrf() }}
  <label>Email
    <input type="email" name="email" autocomplete="username" required autofocus>
  </label>
  <label>Contraseña
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button class="btn btn-block" type="submit">Ingresar</button>
  <p class="muted centrado">¿No tenés cuenta? <a href="{{ url_for('auth.registro') }}">Registrate</a></p>
</form>
{% endblock %}
